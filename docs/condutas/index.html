<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocGO! - Guia de Prescrição</title>
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  <style>
    :root { --bg:#f3f4f2; --card:#fff; --linha:#d9dcd8; --texto:#1c1f1d; --suave:#666d68; --cor:#00805a; --cor-fundo:#e6f3ee; }
    body.dark { --bg:#1a1a1a; --card:#2d2d30; --linha:#444; --texto:#e6e6e6; --suave:#a0a0a0; --cor:#2fc08f; --cor-fundo:#25352f; }
    body { background:var(--bg); color:var(--texto); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
    .painel { background:var(--card); border:1px solid var(--linha); border-radius:8px; }
    #lista { max-height:calc(100vh - 230px); overflow-y:auto; }
    #lista .list-group-item { background:transparent; color:var(--texto); border-color:var(--linha); border-left:3px solid transparent; font-size:.92rem; }
    #lista .list-group-item:hover { background:var(--cor-fundo); }
    #lista .list-group-item.active { background:var(--cor-fundo); border-left-color:var(--cor); color:var(--texto); font-weight:600; }
    #texto { min-height:60vh; font-family:Consolas,Menlo,monospace; font-size:.9rem; line-height:1.45; cursor:pointer; background:var(--card); color:var(--texto); border-color:var(--linha); }
    #texto:hover { border-color:var(--cor); }
    #obs { background:var(--cor-fundo); border-left:3px solid var(--cor); border-radius:4px; padding:10px 12px; font-size:.88rem; white-space:pre-wrap; }
    .toast-custom { position:fixed; top:20px; right:20px; background:#495057; color:#fff; padding:12px 20px; border-radius:6px; z-index:1000; transform:translateX(120%); transition:transform .3s; }
    .toast-custom.show { transform:translateX(0); }
  </style>
</head>
<body>
        <!-- Onde a navbar será injetada -->
        <div id="navbar-placeholder"></div>

        <!-- Carregar a navbar dinamicamente -->
        <script src="../assets/js/navbar-loader.js" defer></script>
        <script>
            fetch("../navbar.html")
                .then(res => res.text())
                .then(data => {
                    document.getElementById("navbar-placeholder").innerHTML = data;
                    
                    // Extrair e executar scripts da navbar
                    const scripts = document.getElementById("navbar-placeholder").querySelectorAll('script');
                    scripts.forEach(script => {
                        const newScript = document.createElement('script');
                        if (script.src) {
                            newScript.src = script.src;
                        } else {
                            newScript.textContent = script.textContent;
                        }
                        document.head.appendChild(newScript);
                        script.remove(); // Remove o script original para evitar duplicação
                    });
                    
                    // Executar correção de links após carregar a navbar
                    if (typeof fixNavbarLinks === 'function') {
                        fixNavbarLinks();
                    }
                });
        </script>
  <div class="container-fluid px-md-4 mt-3">
    <div class="row g-3">
      <div class="col-lg-4 col-xl-3">
        <div class="painel p-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div><h5 class="m-0">Guia de Prescrição</h5><small id="status" class="text-muted"></small></div>
            <div class="d-flex gap-1"><button type="button" id="novo" class="btn btn-sm btn-success d-none">+ Novo</button><button type="button" id="tema" class="btn btn-sm btn-outline-secondary">Escuro</button></div>
          </div>
          <div id="boxTodos" class="form-check form-switch mb-2 d-none"><input class="form-check-input" type="checkbox" id="todos"><label class="form-check-label small" for="todos">Mostrar todos <span class="text-muted">(desligado: só os seus)</span></label></div>
          <input type="search" id="busca" class="form-control mb-2" placeholder="Pesquisar..." autocomplete="off">
          <div id="lista" class="list-group"><div class="p-3 text-muted">Carregando...</div></div>
        </div>
      </div>
      <div class="col-lg-8 col-xl-9" id="conteudo">
        <div class="painel p-3">
          <div class="d-flex justify-content-between align-items-center mb-2 gap-2">
            <h4 class="m-0" id="titulo">Selecione uma opção</h4>
            <div class="d-flex gap-1">
              <button type="button" id="copiar" class="btn btn-success btn-sm" disabled>Copiar</button>
              <button type="button" id="editar" class="btn btn-outline-secondary btn-sm" disabled>Editar</button>
              <button type="button" id="excluir" class="btn btn-outline-danger btn-sm" disabled>Excluir</button>
              <button type="button" id="salvar" class="btn btn-success btn-sm d-none">Salvar</button>
              <button type="button" id="cancelar" class="btn btn-outline-secondary btn-sm d-none">Cancelar</button>
            </div>
          </div>
          <textarea id="texto" class="form-control" readonly placeholder="Escolha um item da lista. Clique no texto para copiar."></textarea>
          <div id="obs" class="mt-3 d-none"></div>
          <textarea id="obsEdit" class="form-control mt-3 d-none" rows="3" placeholder="Obs (opcional)"></textarea>
        </div>
      </div>
    </div>
  </div>
<div class="modal fade" id="modalLogin" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Acessar Sistema</h5></div>
    <div class="modal-body text-center">
      <p class="mb-3">Como você deseja acessar o sistema?</p>
      <button type="button" class="btn btn-outline-secondary w-100" id="semSenha">Apenas Visualizar<small class="d-block text-muted">Não poderá editar ou adicionar</small></button>
      <hr class="my-3"><small class="text-muted">ou</small>
      <label for="inSenha" class="form-label d-block mt-2">Digite sua senha (5 dígitos):</label>
      <input type="password" class="form-control text-center mb-1" id="inSenha" placeholder="•••••" maxlength="5" inputmode="numeric">
      <small class="text-muted d-block mb-3">Apenas números de 0-9</small>
      <button type="button" class="btn btn-success w-100" id="comSenha">Entrar para Editar</button>
    </div>
  </div></div></div>
  <div class="modal fade" id="modalNovo" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Novo item</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <label class="form-label">Título</label><input id="nTitulo" class="form-control mb-2">
      <label class="form-label">Copia e cola</label><textarea id="nTexto" class="form-control mb-2" rows="6"></textarea>
      <label class="form-label">Obs (opcional)</label><textarea id="nObs" class="form-control" rows="2"></textarea>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" id="nSalvar" class="btn btn-success">Adicionar</button></div>
  </div></div></div>
<script>
const URL_PLANILHA = 'https://script.google.com/macros/s/AKfycbx9E30sXGC8z9bOu73vO87kDm03C5gUiGio2Uy0kcX5oChSnVt7_oozh8r4rwlfyumpCQ/exec'; // termina em /exec
const $ = id => document.getElementById(id);
let dados = [], atual = null, somenteLeitura = true, usuario = null;
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function toast(m) {
  const t = Object.assign(document.createElement('div'), { className: 'toast-custom', textContent: m });
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 20);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2000);
}
function copiar() {
  const t = $('texto').value;
  if (!t) return;
  navigator.clipboard.writeText(t).then(() => toast('✅ Copiado!')).catch(() => toast('❌ Erro ao copiar'));
}
function abrir(d) {
  atual = d;
  $('titulo').textContent = d.nome;
  $('texto').value = d.texto;
  $('obs').textContent = d.obs ? 'Obs: ' + d.obs.replace(/^[-•]\s*/, '') : '';
  ['copiar', 'editar', 'excluir'].forEach(i => $(i).disabled = false);
  modo(false);
  dados.forEach(x => x.el.classList.toggle('active', x === d));
  if (innerWidth < 992) $('conteudo').scrollIntoView({ behavior: 'smooth' });
}
const podeEditar = d => !!d && !somenteLeitura && !!d.dono && d.dono === usuario;
function montar(lista) {
  const antigo = atual && atual.titulo;
  lista.forEach(d => { const m = /^\d{5}/.exec(d.titulo); d.dono = m ? m[0] : null; d.nome = m ? d.titulo.slice(5) : d.titulo; });
  dados = lista.sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
  const l = $('lista'); l.innerHTML = '';
  dados.forEach(d => {
    const [cls, txt] = !d.dono ? ['bg-secondary', 'Original'] : podeEditar(d) ? ['bg-success', 'Editável'] : ['bg-warning text-dark', 'Protegido'];
    d.el = document.createElement('button');
    d.el.type = 'button';
    d.el.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center gap-2';
    const n = document.createElement('span'); n.textContent = d.nome;
    const b = document.createElement('span'); b.className = 'badge ' + cls; b.textContent = txt;
    d.el.append(n, b);
    d.el.onclick = () => abrir(d);
    l.appendChild(d.el);
  });
  if (!dados.length) l.innerHTML = '<div class="p-3 text-muted">Planilha vazia</div>';
  filtrar();
  const mesmo = dados.find(d => d.titulo === antigo);
  if (mesmo) abrir(mesmo);
}
function filtrar() {
  const q = norm($('busca').value), todos = somenteLeitura || $('todos').checked;
  dados.forEach(d => d.el.classList.toggle('d-none', !norm(d.nome).includes(q) || !(todos || d.dono === usuario)));
}

async function carregar() {
  try { const c = sessionStorage.getItem('guia'); if (c) montar(JSON.parse(c)); } catch (e) {}   // abre rápido com o último carregamento
  try {
    const novo = await (await fetch(URL_PLANILHA)).json();
    const txt = JSON.stringify(novo);
    if (txt !== sessionStorage.getItem('guia')) { sessionStorage.setItem('guia', txt); montar(novo); }
  } catch (e) {
    if (!dados.length) $('lista').innerHTML = '<div class="p-3 text-danger">Erro ao carregar a planilha</div>';
  }
}
$('busca').addEventListener('input', filtrar);
$('texto').addEventListener('click', () => { if ($('texto').readOnly) copiar(); });
$('copiar').addEventListener('click', copiar);
$('tema').addEventListener('click', () => { document.body.classList.toggle('dark'); localStorage.setItem('darkMode', document.body.classList.contains('dark')); });
if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');

// ---- edição pela página ----
function modo(e) {
  $('texto').readOnly = !e;
  $('obsEdit').classList.toggle('d-none', !e);
  $('obs').classList.toggle('d-none', e || !atual || !atual.obs);
  $('copiar').classList.toggle('d-none', e);
  ['editar', 'excluir'].forEach(i => $(i).classList.toggle('d-none', e || !podeEditar(atual)));
  ['salvar', 'cancelar'].forEach(i => $(i).classList.toggle('d-none', !e));
}
async function enviar(p) {
  p.senha = usuario;
  toast('Salvando...');
  const r = await fetch(URL_PLANILHA, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) });
  const j = await r.json();
  if (j.erro) throw new Error(j.erro);
  const novo = await (await fetch(URL_PLANILHA)).json();
  sessionStorage.setItem('guia', JSON.stringify(novo));
  montar(novo);
}
const falhou = e => toast('❌ ' + e.message);
function limparPainel() {
  atual = null; $('titulo').textContent = 'Selecione uma opção'; $('texto').value = '';
  $('obs').classList.add('d-none'); modo(false);
  ['copiar', 'editar', 'excluir'].forEach(i => $(i).disabled = true);
}
$('editar').addEventListener('click', () => { $('obsEdit').value = atual.obs; modo(true); $('texto').focus(); });
$('cancelar').addEventListener('click', () => { $('texto').value = atual.texto; modo(false); });
$('salvar').addEventListener('click', () =>
  enviar({ acao: 'editar', titulo: atual.titulo, texto: $('texto').value, obs: $('obsEdit').value })
    .then(() => toast('✅ Salvo!')).catch(falhou));
$('excluir').addEventListener('click', () => {
  if (!confirm('Excluir "' + atual.titulo + '"?')) return;
  const t = atual.titulo;
  enviar({ acao: 'excluir', titulo: t }).then(() => { limparPainel(); toast('🗑️ Excluído'); }).catch(falhou);
});
const modalNovo = new bootstrap.Modal($('modalNovo'));
$('novo').addEventListener('click', () => { ['nTitulo', 'nTexto', 'nObs'].forEach(i => $(i).value = ''); modalNovo.show(); });
$('nSalvar').addEventListener('click', () => {
  const nome = $('nTitulo').value.trim(), titulo = usuario + nome, texto = $('nTexto').value;
  if (!nome || !texto.trim()) return toast('⚠️ Preencha título e texto');
  enviar({ acao: 'adicionar', titulo, texto, obs: $('nObs').value })
    .then(() => { modalNovo.hide(); const d = dados.find(x => x.titulo === titulo); if (d) abrir(d); toast('✅ Adicionado!'); }).catch(falhou);
});

// ---- acesso (igual ao original) ----
$('todos').checked = localStorage.getItem('showAll') !== 'false';
$('todos').addEventListener('change', () => { localStorage.setItem('showAll', $('todos').checked); filtrar(); });
const modalLogin = new bootstrap.Modal($('modalLogin'));
function entrar(leitura, senha) {
  somenteLeitura = leitura; usuario = senha;
  $('status').textContent = leitura ? '👁️ Modo Visualização' : '🔑 Usuário: ' + senha;
  $('novo').classList.toggle('d-none', leitura);
  $('boxTodos').classList.toggle('d-none', leitura);
  modalLogin.hide();
  carregar();
}
$('semSenha').addEventListener('click', () => entrar(true, null));
$('comSenha').addEventListener('click', () => {
  const s = $('inSenha').value.trim();
  if (!/^\d{5}$/.test(s)) return alert('A senha deve ter exatamente 5 dígitos numéricos!');
  entrar(false, s);
});
$('inSenha').addEventListener('keypress', e => { if (e.key === 'Enter') $('comSenha').click(); });
modalLogin.show();
</script>
</body>
</html>
