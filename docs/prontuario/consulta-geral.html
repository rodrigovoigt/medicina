<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>DocGO!</title>
        <link rel="icon" type="image/x-icon" href="../assets/img/favicon.ico">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <style>
            body { font-family: Arial, sans-serif; background: #a3a3a3; padding-bottom: 80px; }
            .painel { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
            .grupo { padding: 10px 0; border-bottom: 1px solid #e9ecef; }
            .grupo:last-child { border-bottom: 0; }
            .grupo-h { font-weight: 600; color: #343a40; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
            .grupo:first-child .grupo-h { color: #00805300; color: #008053; }
            .chips { display: flex; flex-wrap: wrap; gap: 6px; }
            .chip { border: 1px solid #ced4da; background: #f8f9fa; color: #343a40; border-radius: 20px; padding: 7px 14px; font-size: 14px; cursor: pointer; transition: all .15s; }
            .chip:hover { background: #e9ecef; }
            .chip.q { border-color: #00a66c; color: #007a50; background: #effaf5; font-weight: 600; }
            .chip.on { background: #00a66c; border-color: #00a66c; color: #fff; }
            .labrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
            .cat { border: 0; background: #dee2e6; font-weight: 600; font-size: 13px; border-radius: 6px; padding: 6px 10px; }
            .cat:hover { background: #ced4da; }
            .info-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #adb5bd; background: #fff; font-size: 12px; line-height: 1; color: #6c757d; }
            .info { display: none; font-size: 13px; color: #6c757d; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 10px; margin-bottom: 8px; max-height: 240px; overflow-y: auto; }
            #resultado { width: 100%; min-height: 260px; font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.4; border: 1px solid #dee2e6; border-radius: 6px; padding: 12px; resize: vertical; cursor: pointer; background: #f8f9fa; }
            #resultado:hover { background: #e9ecef; }
            @media (min-width: 992px) {
                .sticky-col { position: sticky; top: 12px; }
                #resultado { height: calc(100vh - 200px); }
                .barra-mobile { display: none !important; }
            }
            .barra-mobile { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; padding: 10px; box-shadow: 0 -2px 8px rgba(0,0,0,.2); z-index: 50; display: flex; gap: 8px; }
            .toast-custom { position: fixed; top: 20px; right: 20px; background: #495057; color: #fff; padding: 12px 20px; border-radius: 6px; z-index: 1000; font-size: 14px; transform: translateX(120%); transition: transform .3s; }
            .toast-custom.show { transform: translateX(0); }
        </style>
    </head>
    <body>
        <div id="navbar-placeholder"></div>

        <script src="../assets/js/navbar-loader.js" defer></script>
        <script src="../assets/js/navbar-utils.js"></script>
        <script>
            // Usar a nova função utilitária para carregar navbar
            initializeNavbar("../navbar.html");
            
            // Garantir que as funções globais estejam disponíveis após carregamento
            setTimeout(() => {
                // Forçar configuração das funções globais se necessário
                if (typeof window.setupGlobalSearchFunctions === 'function') {
                    window.setupGlobalSearchFunctions();
                } else if (typeof setupMedicalSearchFallback === 'function') {
                    console.log('Usando fallback de busca médica');
                    setupMedicalSearchFallback();
                }
                
                // Verificar se tudo está funcionando
                console.log('🔍 Busca externa:', typeof window.addMedicalSiteFilter === 'function' ? 'OK' : 'ERRO');
                
                // Se ainda não funciona, configurar aqui mesmo
                if (typeof window.addMedicalSiteFilter !== 'function') {
                    console.log('⚠️ Configurando busca médica diretamente na página');
                    
                    // Sites médicos confiáveis
                    const trustedMedicalSites = [
                        'pubmed.ncbi.nlm.nih.gov',
                        'uptodate.com',
                        'cochrane.org',
                        'portal.cfm.org.br',
                        'scielo.br',
                        'msdmanuals.com',
                        'consultaremedios.com.br'
                    ];
                    
                    let lastWebSearchQuery = '';
                    
                    // Função para adicionar filtro de sites médicos - INLINE
                    window.addMedicalSiteFilter = function(event) {
                        console.log('🔍 Função addMedicalSiteFilter chamada - inline');
                        
                        const searchInput = document.getElementById('webSearch');
                        const query = searchInput ? searchInput.value.trim() : '';
                        
                        if (query) {
                            // Evitar processamento duplicado
                            if (lastWebSearchQuery === query) {
                                return true;
                            }
                            lastWebSearchQuery = query;
                            
                            const form = event.target;
                            const existingHidden = form.querySelector('input[name="q"][type="hidden"]');
                            if (existingHidden) {
                                existingHidden.remove();
                            }
                            
                            const hiddenInput = document.createElement('input');
                            hiddenInput.type = 'hidden';
                            hiddenInput.name = 'q';
                            
                            const siteFilter = `(${trustedMedicalSites.map(site => `site:${site}`).join(' OR ')})`;
                            hiddenInput.value = `${query} ${siteFilter}`;
                            
                            form.appendChild(hiddenInput);
                            searchInput.name = 'q_visible';
                            
                            console.log('🔍 Busca externa com filtro aplicado (inline):', hiddenInput.value);
                        } else {
                            event.preventDefault();
                            if (searchInput) {
                                searchInput.focus();
                            }
                        }
                    };
                    
                    console.log('✅ Busca médica configurada inline');
                }
            }, 2000);
        </script>

        <div class="container-fluid px-md-4 mt-3">
            <div class="row g-3">
                <div class="col-lg-7">
                    <div class="painel" id="grupos"></div>
                </div>
                <div class="col-lg-5">
                    <div class="painel sticky-col">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="m-0">📋 Resumo da consulta</h5>
                            <button type="button" class="btn btn-sm btn-outline-secondary btn-limpar">Limpar</button>
                        </div>
                        <small class="text-muted d-block mb-1">Clique no texto para copiar</small>
                        <textarea id="resultado" readonly placeholder="Escolha o modelo de prontuário e os exames. O texto aparece aqui."></textarea>
                        <button type="button" class="btn btn-success w-100 mt-2 btn-copiar">Copiar e limpar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="barra-mobile">
            <button type="button" class="btn btn-outline-secondary btn-limpar">Limpar</button>
            <button type="button" class="btn btn-success flex-grow-1 btn-copiar">Copiar e limpar</button>
        </div>

        <script src="../assets/js/prontuario/consulta-geral.js"></script>
    </body>
</html>
